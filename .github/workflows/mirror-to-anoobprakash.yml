name: Mirror to anoobprakash.github.io

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Push main branch to website repository
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          if [ -z "$TARGET_REPO_PAT" ]; then
            echo "TARGET_REPO_PAT is missing."
            exit 1
          fi

          git remote add target \
            "https://x-access-token:${TARGET_REPO_PAT}@github.com/anoobprakash/anoobprakash.github.io.git"

          git push target main:main --force
