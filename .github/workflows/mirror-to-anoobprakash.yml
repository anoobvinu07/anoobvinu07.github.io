name: Mirror to anoobprakash.github.io

on:
  push:
    branches:
      - main  # change if your default branch is different

permissions:
  contents: write
  
jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so --mirror works if you ever use it

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Remove extra GitHub auth header
        run: |
          git config --unset-all http.https://github.com/.extraheader || true

      - name: Add target remote and push
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          # Add remote pointing at target repo on anoobprakash account
          git remote add target https://x-access-token:${TARGET_REPO_PAT}@github.com/anoobprakash/anoobprakash.github.io.git

          # Push source main branch to target main, overwriting target if necessary
          git push target main --force
