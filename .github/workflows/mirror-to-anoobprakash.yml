name: Render Quarto and publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Quarto source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto website
        run: quarto render

      - name: Publish rendered site to target repository
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          if [ -z "$TARGET_REPO_PAT" ]; then
            echo "TARGET_REPO_PAT is missing."
            exit 1
          fi

          cd _site

          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add --all
          git commit -m "Deploy Quarto site from ${GITHUB_SHA}"

          git branch -M gh-pages

          git remote add target \
            "https://x-access-token:${TARGET_REPO_PAT}@github.com/anoobprakash/anoobprakash.github.io.git"

          git push --force target gh-pages
